<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>avo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="avo-container">
    <header class="avo-header">
      <div class="avo-header-title">
        <button id="historyBtn" class="avo-icon-btn" title="History" aria-label="History">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 8v4l3 3m6-3a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/>
          </svg>
        </button>
        <div class="avo-logo">avo</div>
      </div>
      <div class="avo-header-actions">
        <button id="settingsBtn" class="avo-icon-btn" title="Settings" aria-label="Settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1Z"/>
          </svg>
        </button>
        <button id="clearBtn" class="avo-icon-btn" title="Clear conversation" aria-label="Clear conversation">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 6h18"/>
            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Settings Modal -->
    <div id="settingsModal" class="avo-modal">
      <div class="avo-modal-overlay"></div>
      <div class="avo-modal-content">
        <div class="avo-modal-header">
          <h2>Settings</h2>
          <button id="closeSettingsBtn" class="avo-close-btn" aria-label="Close settings">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 6 6 18"/>
              <path d="m6 6 12 12"/>
            </svg>
          </button>
        </div>

        <div class="avo-modal-body">
          <div class="avo-form-group">
            <label for="apiKeyInput">OpenRouter API Key</label>
            <input
              type="password"
              id="apiKeyInput"
              class="avo-input"
              placeholder="Enter your API key (sk-or-v1-...)"
              autocomplete="off"
            >
            <span class="avo-help-text">Get your API key at <a href="https://openrouter.ai/keys" target="_blank">openrouter.ai/keys</a></span>
          </div>

          <div class="avo-form-group">
            <label for="modelSelect">AI Model</label>
            <select id="modelSelect" class="avo-select">
              <optgroup label="OpenAI">
                <option value="openai/gpt-4">GPT-4</option>
                <option value="openai/gpt-3.5-turbo" selected>GPT-3.5 Turbo (Default)</option>
              </optgroup>
              <optgroup label="Meta">
                <option value="meta-llama/llama-2-70b-chat">Llama 2 70B Chat</option>
                <option value="meta-llama/llama-2-13b-chat">Llama 2 13B Chat</option>
              </optgroup>
              <optgroup label="Anthropic">
                <option value="anthropic/claude-2">Claude 2</option>
                <option value="anthropic/claude-instant">Claude Instant</option>
              </optgroup>
              <optgroup label="Mistral">
                <option value="mistralai/mistral-7b-instruct">Mistral 7B Instruct</option>
              </optgroup>
            </select>
          </div>
        </div>

        <div class="avo-modal-footer">
          <button id="saveSettingsBtn" class="avo-btn avo-btn-primary">Save</button>
        </div>
      </div>
    </div>

    <div class="avo-main-container">
      <!-- History Sidebar -->
      <aside id="historySidebar" class="avo-sidebar">
        <div class="avo-sidebar-header">
          <h2>History</h2>
          <button id="closeHistoryBtn" class="avo-icon-btn" aria-label="Close history">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 6 6 18"/>
              <path d="m6 6 12 12"/>
            </svg>
          </button>
        </div>
        <div id="historyList" class="avo-history-list">
          <!-- History items will be added here -->
          <div class="avo-history-empty">No conversations yet</div>
        </div>
        <div class="avo-sidebar-footer">
          <button id="clearHistoryBtn" class="avo-btn avo-btn-text">Clear All</button>
        </div>
      </aside>

      <div class="avo-content">
        <div class="avo-messages" id="messagesContainer">
          <div class="avo-welcome">
            <div class="avo-welcome-icon">avo</div>
            <h3>Welcome to avo</h3>
            <p>Ask questions about this page or request a summary</p>
          </div>
        </div>

        <footer class="avo-footer">
          <button id="summarizeBtn" class="avo-btn avo-btn-secondary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 8px;">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
            Summarize Page
          </button>
          
          <!-- Paste Text Section -->
          <div class="avo-paste-section">
            <div class="avo-paste-header">
              <button id="pasteTextBtn" class="avo-icon-btn" title="Toggle Paste Text" aria-label="Toggle Paste Text">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
                  <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
                  <path d="M8 12h8"/>
                  <path d="M8 16h8"/>
                </svg>
              </button>
            </div>

            <div class="avo-source-row">
              <span class="avo-source-title">Using:</span>
              <div class="avo-segmented" role="group" aria-label="Text source">
                <button id="sourcePageBtn" class="avo-seg-btn" type="button">Page</button>
                <button id="sourcePastedBtn" class="avo-seg-btn" type="button">Pasted</button>
                <button id="sourceBothBtn" class="avo-seg-btn" type="button">Both</button>
              </div>
              <span id="textSourceIndicator" class="avo-source-indicator">Page content</span>
            </div>

            <textarea
             id="pasteTextInput"
             class="avo-textarea"
             placeholder="Paste text here to analyze..."
             rows="3"
             autocomplete="off"
            ></textarea>
            <div class="avo-paste-actions">
             <button id="askPastedBtn" class="avo-btn avo-btn-text" type="button">Ask</button>
             <button id="summarizePastedBtn" class="avo-btn avo-btn-text" type="button">Summarize</button>
             <button id="clearPastedBtn" class="avo-btn avo-btn-text" type="button">Clear</button>
            </div>
            </div>
          
          <div class="avo-input-wrapper">
            <input
              type="text"
              id="questionInput"
              placeholder="Ask about this page..."
              class="avo-input avo-input-large"
              autocomplete="off"
            >
            <button id="sendBtn" class="avo-btn avo-btn-send" aria-label="Send message">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 2 11 13"/>
                <path d="M22 2 15 22l-3-9-9-3 19-5z"/>
              </svg>
            </button>
          </div>
        </footer>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>

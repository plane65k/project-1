<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>avo - AI Page Assistant</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="avo-container">
    <!-- Header -->
    <header class="avo-header">
      <div class="avo-logo">
        <div class="avo-icon"></div>
        <h1>avo</h1>
      </div>
    </header>

    <!-- Chat Area -->
    <main class="avo-chat" id="chatArea">
      <div class="avo-welcome">
        <div class="avo-welcome-icon">🤖</div>
        <h2>Welcome to avo</h2>
        <p>Your AI assistant for understanding web content</p>
      </div>
    </main>

    <!-- Action Buttons -->
    <div class="avo-actions">
      <button class="avo-btn avo-btn-primary" id="summarizeBtn">
        <span class="avo-btn-icon">📄</span>
        Summarize Page
      </button>
      <button class="avo-btn avo-btn-secondary" id="clearBtn">
        <span class="avo-btn-icon">🔄</span>
        Clear Chat
      </button>
    </div>

    <!-- Input Area -->
    <footer class="avo-input-area">
      <div class="avo-input-wrapper">
        <input 
          type="text" 
          id="userInput" 
          placeholder="Ask about this page..."
          class="avo-input"
          autocomplete="off"
        >
        <button id="sendBtn" class="avo-send-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="m22 2-7 20-4-9-9-4 20-7z"/>
          </svg>
        </button>
      </div>
    </footer>

    <!-- Loading State -->
    <div id="loading" class="avo-loading avo-hidden">
      <div class="avo-loading-dots">
        <div class="avo-dot"></div>
        <div class="avo-dot"></div>
        <div class="avo-dot"></div>
      </div>
      <p>Thinking...</p>
    </div>

    <!-- Error Message -->
    <div id="errorMessage" class="avo-error avo-hidden"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>avo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="avo-container">
    <header class="avo-header">
      <h1>avo</h1>
      <button id="clearBtn" class="avo-clear-btn">Clear</button>
    </header>
    
    <div class="avo-messages" id="messagesContainer">
      <!-- Messages will be added here -->
    </div>
    
    <footer class="avo-footer">
      <button id="summarizeBtn" class="avo-btn-primary">Summarize Page</button>
      <div class="avo-input-group">
        <input 
          type="text" 
          id="questionInput" 
          placeholder="Ask about this page..." 
          class="avo-input"
        >
        <button id="sendBtn" class="avo-btn-send">Send</button>
      </div>
    </footer>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
